<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <!--
    viewport-fit=cover is what makes env(safe-area-inset-*) report anything;
    every control pinned to an edge measures from those (see --edge-* in
    app.css).

    There was an `interactive-widget=resizes-content` here, to keep the name
    box in the creature maker above the on-screen keyboard. It came back from
    a real iPhone as a 52pt strip of white across the bottom of the tank —
    that is the height of Safari's own bottom bar, reserved and then never
    painted. The maker scrolls the box into view itself (`keepVisible`), so
    the token was doing nothing the app was not already doing.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aquarium" />
  <meta name="theme-color" content="#2b96be" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <link rel="icon" href="%sveltekit.assets%/icon.svg" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
